name: ingest

on:
  schedule:
    - cron: "30 22 * * *"  # 22:30 UTC daily, after the US close
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r requirements.txt
      - run: python tickers.py
      # Each source runs even if an earlier one failed; any failure still fails the job.
      - run: python prices.py
        if: ${{ !cancelled() }}
      - run: python news.py
        if: ${{ !cancelled() }}
      - run: python filings.py
        if: ${{ !cancelled() }}
